<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />

  <title>Launchpad · Morrow</title>
  <meta name="description" content="Morrow — your personal career workspace. Track applications, run automations, manage your profile and prepare for what’s next." />
  <link rel="icon" href="/assets/morrow-mark.svg" />
  <link rel="stylesheet" href="./styles/index.css" />
</head>
<body class="auth-pending">
  <a class="skip-link" href="#content">Skip to content</a>
  <div id="offline" class="offline-banner" role="alert" hidden>
    Can&rsquo;t reach the site&rsquo;s server. Trying again&hellip;
  </div>

  <div class="shell">
    <nav id="nav" class="sidebar" aria-label="Sections"></nav>

    <main id="content" class="content" tabindex="-1">
      <div class="state-loading boot-loading" role="status" aria-live="polite">
        <span class="loading-progress" aria-hidden="true"><span></span></span>
        <p>Opening your workspace…</p>
      </div>
    </main>
  </div>

  <aside id="console-dock" aria-label="Run console"></aside>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="confirm" class="confirm-dialog"></dialog>
  <dialog id="mobile-nav" class="confirm-dialog" aria-label="All sections"></dialog>
  <noscript>This dashboard needs JavaScript to load your data and run controls.</noscript>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
